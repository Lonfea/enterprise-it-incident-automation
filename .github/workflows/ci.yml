name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/evaluate.py --output evaluation/report.json
      - run: python -m src.pipeline --input data/sample_system.log
      - run: python -c "from src.api import app; assert app.title == 'IT Incident Automation API'"
